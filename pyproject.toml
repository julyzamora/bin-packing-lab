[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bin-packing-lab"
version = "0.1.0"
description = "Reproducible bin-packing candidate research and evaluation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
binpack = "bin_packing_lab.cli:main"

[tool.setuptools.packages.find]
include = ["bin_packing_lab*"]
